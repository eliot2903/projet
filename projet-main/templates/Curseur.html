<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curseur test</title>
  <style>
    * { cursor: none; margin: 0; padding: 0; }

    #cursor {
      position: fixed;
      width: 6px;
      height: 6px;
      background: #f5c518;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9999;
      transition: transform 0.1s, background 0.2s;
    }

    #cursor-ring {
      position: fixed;
      width: 38px;
      height: 38px;
      border: 3px solid #f5c518;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9998;
      transition: width 0.25s, height 0.25s, border-color 0.2s, opacity 0.2s;
    }

    #cursor.hovered { transform: translate(-50%, -50%) scale(2.5); }
    #cursor-ring.hovered { width: 58px; height: 58px; border-color: rgba(245,197,24,0.4); }
    #cursor.clicked { transform: translate(-50%, -50%) scale(0.5); }
    #cursor-ring.clicked { width: 22px; height: 22px; }

    .trail {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9997;
      background: #f5c518;
      opacity: 0;
    }
  </style>
</head>
<body>

  <div id="cursor"></div>
  <div id="cursor-ring"></div>

  <script>
    const cursor = document.getElementById('cursor');
    const ring   = document.getElementById('cursor-ring');

    let mx = -100, my = -100;
    let rx = -100, ry = -100;
    const LAG = 0.08;

    // Trail plus gros — 14 points, taille de départ 10px
    const TRAIL_COUNT = 14;
    const TRAIL_SIZE  = 10;
    const trails = [];
    for (let i = 0; i < TRAIL_COUNT; i++) {
      const t = document.createElement('div');
      t.classList.add('trail');
      const size = TRAIL_SIZE * (1 - i / TRAIL_COUNT);
      t.style.width  = size + 'px';
      t.style.height = size + 'px';
      document.body.appendChild(t);
      trails.push({ el: t, x: -100, y: -100 });
    }

    document.addEventListener('mousemove', e => {
      mx = e.clientX;
      my = e.clientY;
      cursor.style.left = mx + 'px';
      cursor.style.top  = my + 'px';
    });

    document.querySelectorAll('a, button, [data-hover]').forEach(el => {
      el.addEventListener('mouseenter', () => { cursor.classList.add('hovered'); ring.classList.add('hovered'); });
      el.addEventListener('mouseleave', () => { cursor.classList.remove('hovered'); ring.classList.remove('hovered'); });
    });

    document.addEventListener('mousedown', () => { cursor.classList.add('clicked'); ring.classList.add('clicked'); });
    document.addEventListener('mouseup',   () => { cursor.classList.remove('clicked'); ring.classList.remove('clicked'); });

    document.addEventListener('mouseleave', () => { cursor.style.opacity = '0'; ring.style.opacity = '0'; });
    document.addEventListener('mouseenter', () => { cursor.style.opacity = '1'; ring.style.opacity = '1'; });

    (function animate() {
      rx += (mx - rx) * LAG;
      ry += (my - ry) * LAG;
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';

      let px = mx, py = my;
      trails.forEach((t, i) => {
        const lag = 0.1 + i * 0.035;
        t.x += (px - t.x) * lag;
        t.y += (py - t.y) * lag;
        t.el.style.left = t.x + 'px';
        t.el.style.top  = t.y + 'px';

        const dist = Math.hypot(mx - t.x, my - t.y);
        // Opacité plus forte (0.6 max) et diminue moins vite
        const opacity = Math.max(0, (0.6 - i / TRAIL_COUNT * 0.55) - dist * 0.001);
        t.el.style.opacity = opacity;

        px = t.x;
        py = t.y;
      });

      requestAnimationFrame(animate);
    })();
  </script>

</body>
</html>
