<meta charset="UTF-8">
<title>Cryptage-Décryptage de Vigenère</title>

</head>

<body>

<div class="menu-btn" id="menu-btn">
    <span></span>
    <span></span>
    <span></span>
</div>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<div class="menu" id="menu">
  <button class="close-btn" id="close-btn">X</button>
  <a href="/">Page d'accueil</a>

<div class="logo">
	<a href="/jeu">
        <img src="{{ url_for('static', filename='Logo.png') }}" alt="logo" class="logo-img">
	</a>
</div>

<h1 class="titre">🔐 Chiffre de Vigenère</h1>

<div class="card">
    <h1>🔐 Cryptage</h1>
    <form method="POST">
        <label>Texte</label>
        <textarea name="Entre_texte" id="inputText" placeholder="Entrez votre message"></textarea>

        <label>Clé</label>
        <input name="Cle" type="text" id="key" placeholder="Entrez la clé">

        <div class="buttons">
            <button type="submit">Crypter</button>
        </div>

        <label>Résultat</label>
        <textarea name="Res" id="output" readonly>{{resultat}}</textarea>
    </form>
</div>

<div class="card2">
    <h1>🔓 Décryptage</h1>
    <form method="POST">
        <label>Code</label>
        <textarea name="Entre_texte2" id="inputText2" placeholder="Entrez votre code crypté"></textarea>

        <label>Clé</label>
        <input name="Cle2" type="text" id="key2" placeholder="Entrez la clé">

        <div class="buttons">
            <button type="submit">Décrypter</button>
        </div>

        <label>Résultat</label>
        <textarea name="Res2" id="output2" readonly>{{resultat2}}</textarea>
    </form>
</div>

<script src="{{ url_for('static', filename='cursor.js') }}"></script>
<script src="{{ url_for('static', filename='Action.js') }}"></script>
</body>
